[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "poker-nn-training"
version = "0.1.0"
description = "A small behavior-cloning trainer for no-limit Hold'em PHH datasets."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "datasets>=3.0",
  "pokerkit>=0.7,<0.8",
  "torch>=2.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]

[project.scripts]
poker-nn-train = "poker_nn_training.train:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
